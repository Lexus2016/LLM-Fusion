# llm-fusion — active config (loaded by default; override the path with FUSION_CONFIG).
# Minimal, working setup against Ollama Cloud using real library models.
# See fusion.example.yaml for the fully annotated reference (every option + defaults).

upstream:
  # base_url + api_key_env now live under `providers:` below (new format).
  # These remain pool-wide settings shared by every provider/account.
  api_mode: openai # Phase 0 confirmed: /v1 chat + SSE + tool_calls all work (auto | openai | native)
  max_concurrency: 8 # global p-limit across all in-flight calls (default: 4)
  per_model_concurrency:
    # Per-model gates INSIDE the global limit: a burst on one model queues at its
    # OWN gate instead of head-of-line blocking interactive turns.
    # KEYS MUST NAME A REAL UPSTREAM MODEL — the full tagged id, or the family
    # part before the `:` tag. Until 2026-08-29 this block read `deepseek-v4-pro`
    # / `deepseek-v4-flash` while traffic ran as `deepseek-v4-pro:0813-cloud` /
    # `deepseek-v4-flash:0731-cloud`; the lookup was exact-match only, so BOTH
    # budgets gated nothing and every model silently ran at the global cap.
    # The limiter now also accepts the family prefix, and the proxy warns at
    # startup about any key that still matches no model.
    glm-5.3-flash:cloud: 6
      # hottest model in the config: the smart router, the `simple` route via
      # fast-glm, AND a panel seat in both fusion models.
    deepseek-v4-flash:0731-cloud: 4 # panel seat in both fusion models
    deepseek-v4-pro:0813-cloud: 3 # synth of both fusion models
    kimi-k2.7-code: 3 # panel seat in both fusion models
    gpt-oss:20b-cloud: 2
      # ANTHROPIC_SMALL_FAST_MODEL via fast-background. Claude Code fires 80-130
      # background calls/min; 2 slots keep them flowing without ever occupying
      # more of the global queue than that.
  request_timeout_s: 180
    # per upstream call; MUST be < 182 (default: 170).
    # Raised 120 -> 170 -> 180: a full fusion-coder/researcher path
    # (panel -> judge -> synth -> bineval) on a heavy prompt can
    # exceed 120s at the synth stage and 504 before bineval attaches
    # its headers. 170 leaves a safety margin under the ~182s upstream
    # ceiling and lets the synth + bineval stages finish.

# Provider groups (NEW format). Failover happens across the ACCOUNTS of ONE
# provider (same models), so a fusion stays consistent when an account degrades.
# A virtual model binds to a group via `provider:`; with a single group it is
# optional, so every model below auto-binds to this one. Manage it all live at
# http://127.0.0.1:8081/panel
providers:
  ollama-cloud:
    accounts:
      # quota_markers: lowercase phrases in a 429/402 body that mean the account
      # is OUT OF BUDGET (park it on a long cooldown) rather than briefly
      # rate-limited. An EMPTY list means "never quota", so before 2026-08-29 a
      # spent weekly allowance was classified as a transient rate_limit and the
      # dead account was re-probed every ~60s for hours. These are the exact
      # phrases Ollama Cloud returns.
      - id: ollama-1
        api_key_env: OLLAMA_API_KEY
        treat_403_as: passthrough
        quota_markers:
          - "weekly usage limit"
          - "add extra usage"
          - "requires a subscription"
      - id: ollama-lexus
        api_key_env: OLLAMA_API_KEY_2
        quota_markers:
          - "weekly usage limit"
          - "add extra usage"
          - "requires a subscription"
    type: ollama
    base_url: https://ollama.com

server:
  bind: 127.0.0.1
    # localhost only. For Docker set 0.0.0.0 here
    # (or run with FUSION_BIND=0.0.0.0) so the host can reach it.
  port: 8081
  # auth_token_env: FUSION_PROXY_TOKEN  # optional: when set, clients must send
  # Authorization: Bearer <value-of-that-env-var>.
  # Unset = unauthenticated (localhost single-user) + startup warning.
  admin_token_env: AUTH_WEB_TOKEN

defaults:
  # applied to every model unless overridden per-model
  panel_member_timeout_s: 90 # per panel member (default: 90)
  judge_timeout_s: 120 # judge stage (default: 60)
  min_panel_success: 2 # min successful panel answers, else 502 (default: 1)

models:
  # single — 1:1 passthrough to one fast model.
  fast-glm:
    strategy: single
    provider: ollama-cloud
    target: glm-5.3-flash:cloud
    # This model IS the `simple` route of fusion-agents (see the bottom of this
    # file), i.e. the mechanical agent steps: read a file, run a command, apply
    # an edit. Suppress its chain-of-thought there — no reasoning to leak into
    # chat, and ~3x faster (A/B: 1692->0 reasoning chars, 6s->2s, tool-calling
    # intact). request_overrides is honored by the single strategy AND by the
    # smart `simple` route that resolves to this model.
    # Set to "high" on 2026-08-29 and reverted: high reasoning on a mechanical
    # loop step buys nothing and costs the latency the A/B measured.
    request_overrides:
      reasoning_effort: "none"

  # single — 1:1 passthrough to one fast model.
  fast-kimi:
    strategy: single
    provider: ollama-cloud
    target: kimi-k2.7-code
    # Kept only so a panel voice can be queried directly for comparison against a
    # fused answer. Never routed to, never ANTHROPIC_SMALL_FAST_MODEL — the panel
    # overlap is deliberate and does not deserve a warning on every start.
    panel_contention_ack: true
    request_overrides:
      reasoning_effort: "high"

  # single — 1:1 passthrough to one fast model.
  fast-deepseek:
    strategy: single
    provider: ollama-cloud
    target: deepseek-v4-flash:0731-cloud
    # Kept only so a panel voice can be queried directly for comparison against a
    # fused answer. Never routed to, never ANTHROPIC_SMALL_FAST_MODEL — the panel
    # overlap is deliberate and does not deserve a warning on every start.
    panel_contention_ack: true
    request_overrides:
      reasoning_effort: "high"

  # fast-background — the ONLY model safe for ANTHROPIC_SMALL_FAST_MODEL.
  # Added 2026-08-29. Every other fast-* single shares its upstream with a
  # pipeline role, which is exactly what the fusion-claude rate-limit note warns
  # against (Claude Code fires 80-130 background calls/min and 429-starves the
  # shared model):
  #   fast-glm      -> glm-5.3-flash:cloud          = router + simple route + panel seat x2
  #   fast-kimi     -> kimi-k2.7-code               = panel seat x2
  #   fast-deepseek -> deepseek-v4-flash:0731-cloud = panel seat x2
  # gpt-oss:20b-cloud is used by no panel, judge, synth, router or simple route,
  # so its rate limit is free to burn. Verified 4/4 on a Claude-Code-shaped
  # tool-calling harness (12 tools, real system prompt, multi-turn tool_result)
  # and in live agent traffic (finish_reason=tool_calls with intact arguments).
  # It was briefly pointed at deepseek-v4-flash:0731-cloud, which is a panel seat
  # in BOTH fusion models — that put the 80-130/min background burst on the same
  # bucket as the model that writes files, the exact hazard this entry exists to
  # avoid, and the proxy warned about it four times per start.
  fast-background:
    strategy: single
    provider: ollama-cloud
    target: gpt-oss:20b-cloud
    # gpt-oss leaks its harmony `analysis` channel into visible output when it
    # deliberates; background summarisation never needs it.
    request_overrides:
      reasoning_effort: "none"

  # =========================================================================
  # Task-specialized virtual models — assembled from an empirical model shoot-out
  # (8 models x 3 probes: coding, research, tool-calling — 2026-06-27). Quality scored /15.
  # Panels MIX MODEL LINEAGES on purpose: 3 models from the same lab share
  # training blind spots, which defeats the point of a panel. glm/kimi/
  # deepseek/minimax/qwen are all Chinese labs; gemini=Google, gpt-oss=OpenAI
  # are the available Western decorrelators.
  # STATUS 2026-08-29: the live panel is kimi + deepseek + glm — three Chinese
  # labs, no Western voice, and the synth shares deepseek's lineage with one of
  # them. That is a deliberate quality choice, not an oversight, but it does mean
  # the decorrelation argument above no longer describes this file. A panel with
  # gpt-oss:120b-cloud in the third seat is staged in fusion.tuned.yaml.
  # =========================================================================

  # fusion-coder — programming, planning, audit. Fusion = multiple viewpoints
  #   (coding/architecture decisions genuinely benefit from diverse takes).
  #   Panel history: P1 (2026-06-27) was glm+kimi+gpt-oss; gpt-oss's 131K ctx became
  #   the fusion-agents context bottleneck, so it was swapped for mistral-large-3:675b
  #   (2026-07-08, 262K ctx). Panel changed again same day to a 4-model lineup adding
  #   qwen3-coder:480b-cloud. That model was RETIRED upstream on 2026-07-15 and every
  #   panel fan-out kept paying for it: /api/show 410s ("capability discovery missed",
  #   660/day) plus "panel member dropped (client error response)" (371/day), leaving
  #   the panel running 2-of-4 live voices. Removed 2026-08-07; the degraded panel
  #   correlated with a 6-18% rate of truncated tool-call CONTENT (the model stopping
  #   mid-sentence while still closing valid JSON), which fell to 0-3% within the hour
  #   after removal. Verify a replacement against ollama.com/api/tags before adding it.
  #   gemini-3-flash previously 400'd with "missing thought_signature in functionCall
  #   parts" on panel requests carrying foreign tool-call history (every agent-loop
  #   step) — a 2026-07-08 spot-check (2 synthetic multi-turn probes, with and without
  #   an active tools schema) did NOT reproduce the 400, but this is not exhaustive;
  #   watch the `tool-turn terminal state` log line in real agent-loop sessions.
  fusion-coder:
    strategy: fusion
    provider: ollama-cloud
    panel: [ kimi-k2.7-code, deepseek-v4-flash:0731-cloud, glm-5.3-flash:cloud ]
    # panel: [kimi-k2.7-code, minimax-m3, gpt-oss:120b]   # earlier 3-model alternative, unused
    # Benchmark (bench/fusion-bench.mjs, 15/15 tasks, this panel): the fused answer beat
    # every panel member AND solo glm-5.2 on the 9/15 tasks that completed cleanly
    # (29.56/30 vs best member 26.67/30) — the panel/judge/synth mechanism is sound.
    # The other 6/15 tasks were dragged down by a separate synth bug (the synth
    # narrating its own reasoning — "Expert 1 says X... I will provide..." — into the
    # visible answer, sometimes exhausting the token budget before a real answer),
    # fixed in src/strategies/fusion.ts (SYNTH_DIRECT_ANSWER_DIRECTIVE, 2026-07-08).
    # kimi-k2.7-code is the weakest panel voice in this bench (17.00/30) — prone to
    # long, rambling generations that eat its own token budget; no per-panel-member
    # request_overrides mechanism exists yet to throttle it (only single/smart.simple
    # support request_overrides — see src/config.ts).
    judge: glm-5.3 # most reliable structured-JSON of the glm line -> fewer judge-parse failures
    synth: deepseek-v4-pro:0813-cloud
      # HISTORY: as synth, kimi emitted 17-19k-char draft-style output on
      # factual/reasoning tasks and dragged fusion to 0.71 (below every solo);
      # moving the synth off kimi took the same pipeline to 0.99 vs 0.89 for the
      # best solo — the fused model finally EXCEEDS every member (fusion-lift
      # bench, docs/llm-fusion-audit.md). kimi stays on the panel (its material
      # remains valuable input). The synth seat has since moved glm-5.2 ->
      # deepseek-v4-pro:0813-cloud; NOTE it now shares the deepseek lineage with
      # the deepseek-v4-flash panel seat, so synth and one voice are correlated.
    tool_mode: deliberate
    # Suppress the SYNTH's chain-of-thought: the synth only ASSEMBLES the
    # panel+judge deliberation, so its own reasoning is redundant, leaks English CoT
    # into the agent's chat, and adds latency. reasoning_effort:"none" stops it.
    # Panel members keep full reasoning — that is where the deliberation value lives.
    synth_request_overrides:
      reasoning_effort: "none"
    fusion_planning_turn_only: true
      # full panel on EVERY fresh user instruction (a new task /
      # refinement / module — even days into one chat); synth-only
      # only on mid-loop tool-result continuations (cost knob)
    # IMAGE DESCRIBE pre-stage: every image in the request is described once by
    # the multimodal `model` (minimax-m3 is natively multimodal, Text+Image
    # input) and replaced IN PLACE with a text block, so panel/judge/synth run
    # on pure text — no member needs vision capability and a vision request can
    # never thin the panel below min_panel_success. All-or-nothing: a describer
    # failure falls back to the legacy per-member vision gate unchanged.
    image_describe:
      enabled: true
      model: minimax-m3 # same id already verified as the bineval evaluator
      max_chars: 12000
      timeout_s: 60
    # Optional BinEval post-synth quality evaluation (non-streaming responses only).
    # Adds one extra evaluator call after the synth stage and returns per-dimension
    # scores in response headers: X-Fusion-Bineval-Score, X-Fusion-Bineval-Dimensions,
    # and X-Fusion-Bineval-Low-Score when the overall score is below threshold.
    # Useful for factual consistency checks on research / report outputs.
    bineval:
      enabled: true
      model: minimax-m3
        # The evaluator must sit OUTSIDE panel/judge/synth or it grades answers it
        # helped write. minimax-m3 is used by no other role in this file (only the
        # image_describe pre-stage, which runs before the panel and cannot bias a
        # verdict on the synth's prose).
      threshold: 0.7 # overall score below this marks the output as low-quality
      timeout_s: 60 # per-evaluation timeout; defaults to defaults.judge_timeout_s
      # Custom binary questions (optional; omit to use the built-in defaults):
      dimensions:
        - dimension: factual_consistency
          question: "Does the answer contain only claims well-supported by the request and accepted facts?"

    # Optional web grounding for the panel (research freshness). The proxy runs
    # ONE Tavily search before the panel fans out and injects the cleaned results
    # as prose context into every panel member — no member receives real tools,
    # so the one-tool_calls-per-step invariant is preserved.
    # Gated TWO ways (both required, else fully OFF, no latency/cost):
    #   1. TAVILY_API_KEY must be set in the environment (.env).
    #   2. web_search.enabled must be true here.
    # A failed search degrades silently to an ungrounded panel. Respects
    # fusion_planning_turn_only (no web search on mid-loop tool-result turns).
    web_search:
      enabled: false
        # OFF for the coder (2026-07-07): agent tool-loops route here, and
        # grounding added ~12s of pre-panel silence per deliberate turn
        # (measured 12.7s of a 28.7s time-to-first-byte) while searching
        # for things like "create page.html" — pure latency, no value.
        # fusion-researcher keeps grounding ON (freshness matters there).
      max_results: 5 # Tavily results to fetch (1-10)
      timeout_s: 10 # per-search timeout (< 60)
      max_context_chars: 4000 # cap on the injected context block

  # fusion-researcher — research, analysis, reports. Fusion for breadth.
  #   P2: kimi 15 (flawless, BEST WRITER) | glm-5.2 14 (fast, best framing) |
  #   gpt-oss:120b 13 (most exhaustive coverage + Western lineage).
  fusion-researcher:
    strategy: fusion
    provider: ollama-cloud
    panel: [ kimi-k2.7-code, deepseek-v4-flash:0731-cloud, glm-5.3-flash:cloud ]
    judge: glm-5.3
    synth: deepseek-v4-pro:0813-cloud # scored 15/15; cleanest report-ready prose
    tool_mode: deliberate
    fusion_planning_turn_only: false # research isn't a mechanical loop — full deliberation each step is the value
    # Optional BinEval post-synth quality evaluation (non-streaming responses only).
    # Adds one extra evaluator call after the synth stage and returns per-dimension
    # scores in response headers: X-Fusion-Bineval-Score, X-Fusion-Bineval-Dimensions,
    # and X-Fusion-Bineval-Low-Score when the overall score is below threshold.
    # Useful for factual consistency checks on research / report outputs.
    # IMAGE DESCRIBE pre-stage (same rationale as fusion-coder): screenshots in
    # research requests are described once by minimax-m3 (natively multimodal,
    # Text+Image) and replaced with text, so the panel/synth never need vision.
    image_describe:
      enabled: true
      model: minimax-m3
      max_chars: 12000
      timeout_s: 60
    bineval:
      enabled: true
      model: minimax-m3
        # Same rule as fusion-coder: the evaluator must not be a panel member,
        # the judge, or the synth. deepseek-v4-flash used to hold this seat on the
        # grounds that it "sits outside this pipeline entirely" — that stopped
        # being true when it took a panel seat here, so the evaluator moved to
        # minimax-m3, which holds no deliberating role.
      threshold: 0.7 # overall score below this marks the output as low-quality
      timeout_s: 60 # per-evaluation timeout; defaults to defaults.judge_timeout_s
      # Custom binary questions (optional; omit to use the built-in defaults):
      dimensions:
        - dimension: factual_consistency
          question: "Does the answer contain only claims well-supported by the request and accepted facts?"

    # Optional web grounding for the panel (research freshness). The proxy runs
    # ONE Tavily search before the panel fans out and injects the cleaned results
    # as prose context into every panel member — no member receives real tools,
    # so the one-tool_calls-per-step invariant is preserved.
    # Gated TWO ways (both required, else fully OFF, no latency/cost):
    #   1. TAVILY_API_KEY must be set in the environment (.env).
    #   2. web_search.enabled must be true here.
    # A failed search degrades silently to an ungrounded panel. Respects
    # fusion_planning_turn_only (no web search on mid-loop tool-result turns).
    web_search:
      enabled: true
      max_results: 10 # Tavily results to fetch (1-10)
      timeout_s: 30 # per-search timeout (< 60)
      max_context_chars: 8000 # cap on the injected context block
  # fusion-agents — autonomous agent loops. Smart routing: keep the cheap 80%
  #   cheap, escalate the hard 20%. P3 tool-calling was reliable on ALL models
  #   (<2s, correct first action) -> agent choice = planning quality + cost,
  #   NOT tool-calling.
  fusion-agents:
    strategy: smart
    provider: ollama-cloud
    router: glm-5.3-flash:cloud
    default: simple
    simple: fast-glm
    fusion: fusion-coder
