# llm-fusion — active config (loaded by default; override the path with FUSION_CONFIG).
# Minimal, working setup against Ollama Cloud using real library models.
# See fusion.example.yaml for the fully annotated reference (every option + defaults).

upstream:
  # base_url + api_key_env now live under `providers:` below (new format).
  # These remain pool-wide settings shared by every provider/account.
  api_mode: openai # Phase 0 confirmed: /v1 chat + SSE + tool_calls all work (auto | openai | native)
  max_concurrency: 8 # global p-limit across all in-flight calls (default: 4)
  per_model_concurrency:
    # Per-model gates INSIDE the global limit: a burst on one model queues at its
    # OWN gate instead of head-of-line blocking interactive turns.
    # KEYS MUST NAME A REAL UPSTREAM MODEL — the full tagged id, or the family
    # part before the `:` tag. Until 2026-08-29 this block read `deepseek-v4-pro`
    # / `deepseek-v4-flash` while traffic ran as `deepseek-v4-pro:0813-cloud` /
    # `deepseek-v4-flash:0731-cloud`; the lookup was exact-match only, so BOTH
    # budgets gated nothing and every model silently ran at the global cap.
    # The limiter now also accepts the family prefix, and the proxy warns at
    # startup about any key that still matches no model.
    glm-5.3-flash:cloud: 6
      # hottest model in the config: the smart router, the `simple` route via
      # fast-glm, AND a panel seat in both fusion models.
    deepseek-v4.1-flash:cloud: 4 # panel seat x2 + synth x2 + image_describe x2
    glm-5.3: 3 # judge of fusion-coder AND fusion-researcher
    kimi-k2.7-code: 4
      # Raised 3 -> 4 on 2026-09-16. This is the ONLY gate that has ever reported
      # saturation in this config: 6x "per-model concurrency budget saturated,
      # queued 1" in .launchd.log, always kimi. It holds a panel seat in BOTH
      # ollama fusions plus fast-kimi, so two overlapping requests already fill 3.
    gpt-oss:20b-cloud: 3
      # ANTHROPIC_SMALL_FAST_MODEL via fast-background (Claude Code fires 80-130
      # background calls/min), AND since 2026-09-16 the bineval evaluator of
      # fusion-researcher. Raised 2 -> 3 to cover that extra call.
    # --- lg-server seats -----------------------------------------------------
    auto/js-coding: 4 # fast-js-code + the `simple` route of fusion-agents-x
    agy/gemini-3.5-flash-lite: 6 # router of fusion-agents-x + image_describe of fusion-coder-x
    misha/glm-5.3: 3 # judge of fusion-coder-x
    misha/MiniMax-M3: 3 # panel seat in fusion-coder-x
    agy/gemini-3.8-flash-high: 3 # panel seat in fusion-coder-x
    cx/gpt-5.6-terra-high: 3 # panel seat in fusion-coder-x
    xai/grok-4.6-high: 3 # synth of fusion-coder-x
      # REMOVED 2026-09-16, all verified dead with a live text probe against
      # lmlm.localguard.me ("not available in the active live catalog"):
      # ollamacloud/deepseek-v4.1-flash, cc/claude-opus-5-low, gemini/gemini-3.8-flash.
      # deepseek-v4-pro:0813-cloud was dropped too — it is alive upstream but has
      # held no seat since the synth moved to deepseek-v4.1-flash, and the proxy
      # was already listing it as a dead key on every start.
  request_timeout_s: 180
    # per upstream call; MUST be < 182 (default: 170).
    # Raised 120 -> 170 -> 180: a full fusion-coder/researcher path
    # (panel -> judge -> synth -> bineval) on a heavy prompt can
    # exceed 120s at the synth stage and 504 before bineval attaches
    # its headers. 170 leaves a safety margin under the ~182s upstream
    # ceiling and lets the synth + bineval stages finish.

# Provider groups (NEW format). Failover happens across the ACCOUNTS of ONE
# provider (same models), so a fusion stays consistent when an account degrades.
# A virtual model binds to a group via `provider:`; with a single group it is
# optional, so every model below auto-binds to this one. Manage it all live at
# http://127.0.0.1:8081/panel
providers:
  ollama-cloud:
    accounts:
      # quota_markers: lowercase phrases in a 429/402 body that mean the account
      # is OUT OF BUDGET (park it on a long cooldown) rather than briefly
      # rate-limited. An EMPTY list means "never quota", so before 2026-08-29 a
      # spent weekly allowance was classified as a transient rate_limit and the
      # dead account was re-probed every ~60s for hours. These are the exact
      # phrases Ollama Cloud returns.
      - id: ollama-1
        api_key_env: OLLAMA_API_KEY
        treat_403_as: passthrough
        quota_markers:
          - "weekly usage limit"
          - "add extra usage"
          - "requires a subscription"
      - id: ollama-lexus
        api_key_env: OLLAMA_API_KEY_2
        quota_markers:
          - "weekly usage limit"
          - "add extra usage"
          - "requires a subscription"
    type: ollama
    base_url: https://ollama.com
  lg-server:
    accounts:
      # quota_markers: lowercase phrases in a 429/402 body that mean the account
      # is OUT OF BUDGET (park it on a long cooldown) rather than briefly
      # rate-limited. An EMPTY list means "never quota", so before 2026-08-29 a
      # spent weekly allowance was classified as a transient rate_limit and the
      # dead account was re-probed every ~60s for hours. These are the exact
      # phrases Ollama Cloud returns.
      - id: lg-api
        api_key_env: LG_API_KEY
        treat_403_as: passthrough
        quota_markers:
          - "weekly usage limit"
          - "add extra usage"
          - "requires a subscription"
    type: openai-compat
    base_url: https://lmlm.localguard.me

server:
  bind: 127.0.0.1
    # localhost only. For Docker set 0.0.0.0 here
    # (or run with FUSION_BIND=0.0.0.0) so the host can reach it.
  port: 8081
  # auth_token_env: FUSION_PROXY_TOKEN  # optional: when set, clients must send
  # Authorization: Bearer <value-of-that-env-var>.
  # Unset = unauthenticated (localhost single-user) + startup warning.
  admin_token_env: AUTH_WEB_TOKEN

defaults:
  # applied to every model unless overridden per-model
  panel_member_timeout_s: 90 # per panel member (default: 90)
  judge_timeout_s: 120 # judge stage (default: 60)
  min_panel_success: 2 # min successful panel answers, else 502 (default: 1)

# =============================================================================
# typesafe — typed judgments (TypeSafe System One / Jev) in the hot path
# =============================================================================
# Two conditions for every feature here: the flag AND TYPESAFE_API_KEY in .env.
# Neither alone makes a call. Each one degrades to the behaviour it replaced, so
# an outage or a dead key costs latency, never a route.
# Measured live against jev-latest on 2026-09-19, before enabling any of this:
#   - narrate-and-stop question: 16/16 correct at threshold 0.75 across EN, UA,
#     RU, JA, DE, PL — positives 0.90-0.97, negatives 0.02-0.11, nothing within
#     0.6 of the threshold. The "Jev is English-first so UA/RU will suffer"
#     worry did not survive contact with the data.
#   - router: 8/8 as expected. The stuck-loop case is the one worth knowing:
#     the Choice came back simple at confidence 0.27 (the next STEP really is
#     mechanical) while stuck scored 0.98 — two questions in one request get
#     right what either alone gets wrong.
#   - web gate on a live Tavily search + one planted injection: 4 real results
#     kept, the injection caught at 0.98 — while ALSO scoring relevant 0.90 and
#     evidence 0.94, which is exactly why injection is tested first.
#   - latency, median of 5: 297ms for the guard question, 246ms for the router.
#     The router REPLACES a 1-3s LLM round trip, so it is a latency win; the
#     guard costs ~300ms once per completed agent turn.
typesafe:
  enabled: true
  model: jev-latest
  timeout_s: 10

  # The tool-turn guard detects a turn that ANNOUNCED its next action instead of
  # performing it ("Пишу повний посібник у файл…" and then stop) and re-asks. Its
  # detector is 33 literal phrases in EN/UA/RU, so any other language and any
  # unlisted phrasing walks straight through and the agent loop stalls until you
  # type "continue". This asks the same question of a model instead — but ONLY
  # when the phrase list found nothing and the turn could still be one
  # (finish_reason: stop, no tool call, non-empty answer). A step that emits a
  # tool call never reaches it, so the real cost is about one question per
  # COMPLETED turn, not per step.
  tool_turn_guard:
    enabled: true
    threshold: 0.75 # a false positive re-runs a FINISHED turn, so this sits high

  # Routing for the smart models below. One request answers both questions the
  # LLM router needs two mechanisms for: which route, and whether the loop is
  # stuck repeating a failed step (today 11 regexes that bypass the router when
  # one matches). Below confidence_min the model's own `default` route is used.
  router:
    enabled: true
    confidence_min: 0.50
    stuck_threshold: 0.70

models:
  # single — 1:1 passthrough to one fast model.
  fast-js-code:
    strategy: single
    provider: lg-server
    target: auto/js-coding
  fast-glm:
    strategy: single
    provider: ollama-cloud
    target: glm-5.3-flash:cloud
    panel_contention_ack: true
    # Kept so a panel voice can be queried directly for comparison against a fused
    # answer. Its target is a panel seat in BOTH ollama fusions, so the overlap is
    # deliberate and acked — without the ack this warned twice on every start,
    # which is exactly the noise v0.1.43 removed elsewhere in this file.
    # NOTE: this comment used to claim fast-glm IS the `simple` route of
    # fusion-agents. It is not, and has not been since that slot moved to
    # fast-deepseek (see the bottom of this file) — keep its reasoning_effort
    # short anyway, the measurements below still hold for direct calls.
    #
    # MUST NOT be "none". MEASURED 2026-08-31 against ollama.com/v1, same prompt:
    #   no parameter          -> content "17 × 23 = 391."
    #                            reasoning "The user asks: ... Let me verify: ..."
    #                            (separate field; the proxy strips/buffers it)
    #   reasoning_effort none -> content "The user asks: ... Let me verify: ...
    #                            Answer in one sentence in Ukrainian.</think>17 × 23 = 391."
    #                            (NO reasoning field, NO opening <think>)
    #   reasoning_effort low  -> content "17 × 23 = 391."   <- clean
    # "none" does NOT disable thinking on glm-5.3-flash: it moves the WHOLE chain
    # of thought into `content`, closed by a bare `</think>` with no opening tag.
    # No proxy-side filter can undo that on a STREAM (the CoT is already on the
    # wire before the marker arrives), so every simple agent step shipped English
    # CoT into the visible chat. The earlier A/B that read "1692->0 reasoning
    # chars" measured the FIELD emptying, not the reasoning stopping.
    # Set to "high" on 2026-08-29 and reverted: high reasoning on a mechanical
    # loop step buys nothing and costs the latency the A/B measured.
    request_overrides:
      reasoning_effort: "low"

  # single — 1:1 passthrough to one fast model.
  fast-kimi:
    strategy: single
    provider: ollama-cloud
    target: kimi-k2.7-code
    # Kept only so a panel voice can be queried directly for comparison against a
    # fused answer. Never routed to, never ANTHROPIC_SMALL_FAST_MODEL — the panel
    # overlap is deliberate and does not deserve a warning on every start.
    panel_contention_ack: true
    request_overrides:
      reasoning_effort: "high"

  # single — 1:1 passthrough to one fast model.
  fast-deepseek:
    strategy: single
    provider: ollama-cloud
    target: deepseek-v4.1-flash:cloud
    # Kept only so a panel voice can be queried directly for comparison against a
    # fused answer. Never routed to, never ANTHROPIC_SMALL_FAST_MODEL — the panel
    # overlap is deliberate and does not deserve a warning on every start.
    panel_contention_ack: true
    request_overrides:
      reasoning_effort: "high"

  # fast-background — the ONLY model safe for ANTHROPIC_SMALL_FAST_MODEL.
  # Added 2026-08-29. Every other fast-* single shares its upstream with a
  # pipeline role, which is exactly what the fusion-claude rate-limit note warns
  # against (Claude Code fires 80-130 background calls/min and 429-starves the
  # shared model):
  #   fast-glm      -> glm-5.3-flash:cloud          = router + simple route + panel seat x2
  #   fast-kimi     -> kimi-k2.7-code               = panel seat x2
  #   fast-deepseek -> deepseek-v4-flash:0731-cloud = panel seat x2
  # gpt-oss:20b-cloud is used by no panel, judge, synth, router or simple route,
  # so its rate limit is free to burn. Verified 4/4 on a Claude-Code-shaped
  # tool-calling harness (12 tools, real system prompt, multi-turn tool_result)
  # and in live agent traffic (finish_reason=tool_calls with intact arguments).
  # It was briefly pointed at deepseek-v4-flash:0731-cloud, which is a panel seat
  # in BOTH fusion models — that put the 80-130/min background burst on the same
  # bucket as the model that writes files, the exact hazard this entry exists to
  # avoid, and the proxy warned about it four times per start.
  fast-background:
    strategy: single
    provider: ollama-cloud
    target: gpt-oss:20b-cloud
    # gpt-oss deliberates in a harmony `analysis` channel, and with a small
    # max_tokens that reasoning eats the budget — the proxy then promotes it into
    # the visible answer (promote_reasoning_to_content) and the caller sees
    # "The user says: ..." instead of a reply.
    # MEASURED 2026-08-29 on gpt-oss:20b-cloud, same prompt:
    #   no parameter          -> reasoning ~90 chars
    #   reasoning_effort none -> reasoning ~90 chars  (IGNORED — it is a no-op here)
    #   reasoning_effort low  -> reasoning "Print OK." (9 chars)
    # "none" is honoured by glm (see fast-glm) but NOT by gpt-oss, so this entry
    # must use "low". Do not "unify" the two.
    request_overrides:
      reasoning_effort: "low"

  # =========================================================================
  # Task-specialized virtual models — assembled from an empirical model shoot-out
  # (8 models x 3 probes: coding, research, tool-calling — 2026-06-27). Quality scored /15.
  # Panels MIX MODEL LINEAGES on purpose: 3 models from the same lab share
  # training blind spots, which defeats the point of a panel. glm/kimi/
  # deepseek/minimax/qwen are all Chinese labs; gemini=Google, gpt-oss=OpenAI
  # are the available Western decorrelators.
  # STATUS 2026-08-29: the live panel is kimi + deepseek + glm — three Chinese
  # labs, no Western voice, and the synth shares deepseek's lineage with one of
  # them. That is a deliberate quality choice, not an oversight, but it does mean
  # the decorrelation argument above no longer describes this file. A panel with
  # gpt-oss:120b-cloud in the third seat is staged in fusion.tuned.yaml.
  # =========================================================================

  # fusion-coder — programming, planning, audit. Fusion = multiple viewpoints
  #   (coding/architecture decisions genuinely benefit from diverse takes).
  #   Panel history: P1 (2026-06-27) was glm+kimi+gpt-oss; gpt-oss's 131K ctx became
  #   the fusion-agents context bottleneck, so it was swapped for mistral-large-3:675b
  #   (2026-07-08, 262K ctx). Panel changed again same day to a 4-model lineup adding
  #   qwen3-coder:480b-cloud. That model was RETIRED upstream on 2026-07-15 and every
  #   panel fan-out kept paying for it: /api/show 410s ("capability discovery missed",
  #   660/day) plus "panel member dropped (client error response)" (371/day), leaving
  #   the panel running 2-of-4 live voices. Removed 2026-08-07; the degraded panel
  #   correlated with a 6-18% rate of truncated tool-call CONTENT (the model stopping
  #   mid-sentence while still closing valid JSON), which fell to 0-3% within the hour
  #   after removal. Verify a replacement against ollama.com/api/tags before adding it.
  #   gemini-3-flash previously 400'd with "missing thought_signature in functionCall
  #   parts" on panel requests carrying foreign tool-call history (every agent-loop
  #   step) — a 2026-07-08 spot-check (2 synthetic multi-turn probes, with and without
  #   an active tools schema) did NOT reproduce the 400, but this is not exhaustive;
  #   watch the `tool-turn terminal state` log line in real agent-loop sessions.
  fusion-coder:
    strategy: fusion
    provider: ollama-cloud
    panel: [ kimi-k2.7-code, deepseek-v4.1-flash:cloud, glm-5.3-flash:cloud ]
    # panel: [kimi-k2.7-code, minimax-m3, gpt-oss:120b]   # earlier 3-model alternative, unused
    # Benchmark (bench/fusion-bench.mjs, 15/15 tasks, this panel): the fused answer beat
    # every panel member AND solo glm-5.2 on the 9/15 tasks that completed cleanly
    # (29.56/30 vs best member 26.67/30) — the panel/judge/synth mechanism is sound.
    # The other 6/15 tasks were dragged down by a separate synth bug (the synth
    # narrating its own reasoning — "Expert 1 says X... I will provide..." — into the
    # visible answer, sometimes exhausting the token budget before a real answer),
    # fixed in src/strategies/fusion.ts (SYNTH_DIRECT_ANSWER_DIRECTIVE, 2026-07-08).
    # kimi-k2.7-code is the weakest panel voice in this bench (17.00/30) — prone to
    # long, rambling generations that eat its own token budget; no per-panel-member
    # request_overrides mechanism exists yet to throttle it (only single/smart.simple
    # support request_overrides — see src/config.ts).
    judge: glm-5.3 # most reliable structured-JSON of the glm line -> fewer judge-parse failures
    synth: deepseek-v4.1-flash:cloud
      # HISTORY: as synth, kimi emitted 17-19k-char draft-style output on
      # factual/reasoning tasks and dragged fusion to 0.71 (below every solo);
      # moving the synth off kimi took the same pipeline to 0.99 vs 0.89 for the
      # best solo — the fused model finally EXCEEDS every member (fusion-lift
      # bench, docs/llm-fusion-audit.md). kimi stays on the panel (its material
      # remains valuable input). The synth seat has since moved glm-5.2 ->
      # deepseek-v4-pro:0813-cloud; NOTE it now shares the deepseek lineage with
      # the deepseek-v4-flash panel seat, so synth and one voice are correlated.
    # Compress the panel's copy of the history only past this many characters of
    # conversation text (message content PLUS tool-call arguments). The binding
    # constraint is the SMALLEST window on this panel — kimi-k2.7-code at 262144
    # tokens (deepseek-v4.1-flash and glm-5.3-flash are 1M, confirmed via
    # /api/show). 500000 chars stays under it even at a worst-case 2 chars/token
    # (Cyrillic prose, minified JSON), and leaves room for the completion. The
    # 200000 default is sized for a 64k-token member: on THIS panel it threw away
    # four fifths of the context the members could hold, and 12.5% of live traffic
    # was past it (375 of 3012 requests).
    panel_max_chars: 500000
    tool_mode: deliberate
    # Suppress the SYNTH's chain-of-thought: the synth only ASSEMBLES the
    # panel+judge deliberation, so its own reasoning is redundant, leaks English CoT
    # into the agent's chat, and adds latency. reasoning_effort:"none" stops it.
    # Panel members keep full reasoning — that is where the deliberation value lives.
    synth_request_overrides:
      reasoning_effort: "none"
    fusion_planning_turn_only: true
      # full panel on EVERY fresh user instruction (a new task /
      # refinement / module — even days into one chat); synth-only
      # only on mid-loop tool-result continuations (cost knob)
    # IMAGE DESCRIBE pre-stage: every image in the request is described once by
    # the multimodal `model` and replaced IN PLACE with a text block, so
    # panel/judge/synth run on pure text — no member needs vision capability and a
    # vision request can never thin the panel below min_panel_success.
    # All-or-nothing: a describer failure falls back to the legacy per-member
    # vision gate unchanged. The describer is pre-panel and sees no panel output,
    # so sharing an id with a panel/synth seat cannot bias a verdict — it only
    # shares that model's concurrency budget.
    image_describe:
      enabled: true
      model: deepseek-v4.1-flash:cloud # VERIFIED live on a real screenshot
      max_chars: 12000
      timeout_s: 60
    # Optional BinEval post-synth quality evaluation (non-streaming responses only).
    # Adds one extra evaluator call after the synth stage and returns per-dimension
    # scores in response headers: X-Fusion-Bineval-Score, X-Fusion-Bineval-Dimensions,
    # and X-Fusion-Bineval-Low-Score when the overall score is below threshold.
    # Useful for factual consistency checks on research / report outputs.
    bineval:
      enabled: false
        # OFF since 2026-09-16, for two independent reasons.
        # 1. CORRECTNESS: the evaluator was deepseek-v4.1-flash:cloud, which is
        #    simultaneously a PANEL SEAT and the SYNTH of this model — it was
        #    grading the answer it had just written. The comment here claimed the
        #    evaluator was minimax-m3 and "used by no other role"; that stopped
        #    being true when the seats moved, and nothing flagged it.
        # 2. LATENCY: bineval is one extra upstream call AFTER the synth, and it
        #    is the agent-loop path that routes here. Measured on req de359ae8
        #    (.launchd.log): the evaluator timed out at its full 60 s and the
        #    request still completed at 107.7 s — a minute of pure waiting for a
        #    score that only ever reaches response HEADERS.
        # fusion-researcher keeps it: reports are worth one extra call, and its
        # evaluator now sits outside the pipeline.
      model: deepseek-v4.1-flash:cloud
      threshold: 0.7 # overall score below this marks the output as low-quality
      timeout_s: 60 # per-evaluation timeout; defaults to defaults.judge_timeout_s
      # Custom binary questions (optional; omit to use the built-in defaults):
      dimensions:
        - dimension: factual_consistency
          question: "Does the answer contain only claims well-supported by the request and accepted facts?"

    # Optional web grounding for the panel (research freshness). The proxy runs
    # ONE Tavily search before the panel fans out and injects the cleaned results
    # as prose context into every panel member — no member receives real tools,
    # so the one-tool_calls-per-step invariant is preserved.
    # Gated TWO ways (both required, else fully OFF, no latency/cost):
    #   1. TAVILY_API_KEY must be set in the environment (.env).
    #   2. web_search.enabled must be true here.
    # A failed search degrades silently to an ungrounded panel. Respects
    # fusion_planning_turn_only (no web search on mid-loop tool-result turns).
    web_search:
      enabled: false
        # OFF for the coder (2026-07-07): agent tool-loops route here, and
        # grounding added ~12s of pre-panel silence per deliberate turn
        # (measured 12.7s of a 28.7s time-to-first-byte) while searching
        # for things like "create page.html" — pure latency, no value.
        # fusion-researcher keeps grounding ON (freshness matters there).
      max_results: 5 # Tavily results to fetch (1-10)
      timeout_s: 10 # per-search timeout (< 60)
      # TypeSafe screening of each result BEFORE it is formatted into the panel
      # prompt. Two keys, same contract as the search itself: this flag AND
      # TYPESAFE_API_KEY in .env — neither alone does anything, and with
      # web_search.enabled false above, nothing here runs at all.
      #
      # Three yes/no judgments per result, thresholded in code rather than asked
      # for in a prompt: is the page trying to steer the system reading it
      # (checked FIRST — a poisoned page is usually relevant and useful-looking
      # too), is it about the request, does it state anything an answer can use.
      # Fails OPEN: if TypeSafe is unreachable the results pass through
      # unscreened (still fenced as untrusted data) with one WARN in the log.
      gate:
        enabled: true
      max_context_chars: 4000 # cap on the injected context block

  fusion-coder-x:
    strategy: fusion
    provider: lg-server
    panel: [ misha/MiniMax-M3, agy/gemini-3.8-flash-high, cx/gpt-5.6-terra-high ]
    # ollamacloud/deepseek-v4.1-flash held the first seat until 2026-09-16 and was
    # DEAD upstream ("Model 'deepseek-v4.1-flash' is not available in the active
    # live catalog for provider 'ollamacloud'"). With min_panel_success: 2 the
    # panel was running 2-of-3 on every request — one more failure from a 502.
    # MiniMax keeps the three seats on three different lineages (MiniMax / Google
    # / OpenAI), which is the whole point of a panel.
    # panel: [kimi-k2.7-code, minimax-m3, gpt-oss:120b]   # earlier 3-model alternative, unused
    # Benchmark (bench/fusion-bench.mjs, 15/15 tasks, this panel): the fused answer beat
    # every panel member AND solo glm-5.2 on the 9/15 tasks that completed cleanly
    # (29.56/30 vs best member 26.67/30) — the panel/judge/synth mechanism is sound.
    # The other 6/15 tasks were dragged down by a separate synth bug (the synth
    # narrating its own reasoning — "Expert 1 says X... I will provide..." — into the
    # visible answer, sometimes exhausting the token budget before a real answer),
    # fixed in src/strategies/fusion.ts (SYNTH_DIRECT_ANSWER_DIRECTIVE, 2026-07-08).
    # kimi-k2.7-code is the weakest panel voice in this bench (17.00/30) — prone to
    # long, rambling generations that eat its own token budget; no per-panel-member
    # request_overrides mechanism exists yet to throttle it (only single/smart.simple
    # support request_overrides — see src/config.ts).
    judge: misha/glm-5.3 # most reliable structured-JSON of the glm line -> fewer judge-parse failures
    synth: xai/grok-4.6-high
      # Strongest model in the pipeline sits on synth, not on the panel: the panel
      # supplies material, the synth decides the answer the caller sees.
      # cc/claude-opus-5-low held this seat until 2026-09-16 and was DEAD upstream
      # ("Model 'claude-opus-5-low' is not available in the active live catalog for
      # provider 'claude'"), so EVERY fusion-coder-x request was silently falling
      # back to the judge as synth. The whole agy/claude-* family answers 429 on
      # probe, so an Anthropic seat here is not dependable; grok-4.6 is live and
      # adds a fourth lineage (panel is MiniMax/Google/OpenAI, judge is glm).
      # A tiered `-high` id, NOT synth_request_overrides reasoning_effort:"none" —
      # that parameter is honoured inconsistently per model (see fast-glm vs
      # fast-background). Thinking budget is kept on purpose: reconciling
      # conflicting panel answers is the reason this seat exists.
    tool_mode: deliberate
    # NOTE: unlike fusion-coder there is deliberately NO synth_request_overrides
    # here. The synth seat carries its reasoning tier in the model id itself
    # (`xai/grok-4.6-high`), because reasoning_effort is honoured inconsistently
    # across models — see the measurements on fast-glm vs fast-background.
    fusion_planning_turn_only: true
      # full panel on EVERY fresh user instruction (a new task /
      # refinement / module — even days into one chat); synth-only
      # only on mid-loop tool-result continuations (cost knob)
    # IMAGE DESCRIBE pre-stage: every image in the request is described once by
    # the multimodal `model` (minimax-m3 is natively multimodal, Text+Image
    # input) and replaced IN PLACE with a text block, so panel/judge/synth run
    # on pure text — no member needs vision capability and a vision request can
    # never thin the panel below min_panel_success. All-or-nothing: a describer
    # failure falls back to the legacy per-member vision gate unchanged.
    image_describe:
      enabled: true
      model: agy/gemini-3.5-flash-lite
        # Changed 2026-09-16. gemini/gemini-3.8-flash was DEAD (the whole `gemini/`
        # prefix answers "not available in the active live catalog"), so every
        # image request to fusion-coder-x fell back to the legacy vision gate and
        # 400'd — "none of its panel members are vision-capable". Note the `agy/`
        # prefix of the SAME family is alive: this was a dead provider prefix, not
        # a dead model. VERIFIED on a real 133 KB screenshot: answered "Create
        # model" in 2.1 s, the fastest of every live vision candidate probed.
      max_chars: 16000
      timeout_s: 60
    # Optional BinEval post-synth quality evaluation (non-streaming responses only).
    # Adds one extra evaluator call after the synth stage and returns per-dimension
    # scores in response headers: X-Fusion-Bineval-Score, X-Fusion-Bineval-Dimensions,
    # and X-Fusion-Bineval-Low-Score when the overall score is below threshold.
    # Useful for factual consistency checks on research / report outputs.
    bineval:
      enabled: false
        # OFF since 2026-09-16, same reasoning as fusion-coder: this model is the
        # `fusion` branch of fusion-agents-x, i.e. an AGENT path, and bineval is one
        # extra upstream call after the synth whose score only ever reaches response
        # HEADERS. Measured before switching it off: 49.7 s for a request whose
        # whole content was "Reply with exactly: OK".
      model: misha/qwen3.6-35b-a3b
        # The evaluator must sit OUTSIDE panel/judge/synth or it grades answers it
        # helped write. It was xai/grok-4.6-low, which became the SYNTH's own
        # lineage when the dead opus seat was replaced by xai/grok-4.6-high on
        # 2026-09-16. Qwen holds no other seat here (panel MiniMax/Google/OpenAI,
        # judge glm, synth grok) and probes at 1.7 s, which matters because bineval
        # runs AFTER synth under request_timeout_s: 180.
      threshold: 0.7 # overall score below this marks the output as low-quality
      timeout_s: 60 # per-evaluation timeout; defaults to defaults.judge_timeout_s
      # Custom binary questions (optional; omit to use the built-in defaults):
      dimensions:
        - dimension: factual_consistency
          question: "Does the answer contain only claims well-supported by the request and accepted facts?"

    # Optional web grounding for the panel (research freshness). The proxy runs
    # ONE Tavily search before the panel fans out and injects the cleaned results
    # as prose context into every panel member — no member receives real tools,
    # so the one-tool_calls-per-step invariant is preserved.
    # Gated TWO ways (both required, else fully OFF, no latency/cost):
    #   1. TAVILY_API_KEY must be set in the environment (.env).
    #   2. web_search.enabled must be true here.
    # A failed search degrades silently to an ungrounded panel. Respects
    # fusion_planning_turn_only (no web search on mid-loop tool-result turns).
    web_search:
      enabled: false
        # OFF for the coder (2026-07-07): agent tool-loops route here, and
        # grounding added ~12s of pre-panel silence per deliberate turn
        # (measured 12.7s of a 28.7s time-to-first-byte) while searching
        # for things like "create page.html" — pure latency, no value.
        # fusion-researcher keeps grounding ON (freshness matters there).
      max_results: 5 # Tavily results to fetch (1-10)
      timeout_s: 10 # per-search timeout (< 60)
      # TypeSafe screening of each result BEFORE it is formatted into the panel
      # prompt. Two keys, same contract as the search itself: this flag AND
      # TYPESAFE_API_KEY in .env — neither alone does anything, and with
      # web_search.enabled false above, nothing here runs at all.
      #
      # Three yes/no judgments per result, thresholded in code rather than asked
      # for in a prompt: is the page trying to steer the system reading it
      # (checked FIRST — a poisoned page is usually relevant and useful-looking
      # too), is it about the request, does it state anything an answer can use.
      # Fails OPEN: if TypeSafe is unreachable the results pass through
      # unscreened (still fenced as untrusted data) with one WARN in the log.
      gate:
        enabled: true
      max_context_chars: 4000 # cap on the injected context block

  # fusion-researcher — research, analysis, reports. Fusion for breadth.
  #   P2: kimi 15 (flawless, BEST WRITER) | glm-5.2 14 (fast, best framing) |
  #   gpt-oss:120b 13 (most exhaustive coverage + Western lineage).
  fusion-researcher:
    strategy: fusion
    provider: ollama-cloud
    panel: [ kimi-k2.7-code, deepseek-v4.1-flash:cloud, glm-5.3-flash:cloud ]
    judge: glm-5.3
    synth: deepseek-v4.1-flash:cloud # scored 15/15; cleanest report-ready prose
    # Compress the panel's copy of the history only past this many characters of
    # conversation text (message content PLUS tool-call arguments). The binding
    # constraint is the SMALLEST window on this panel — kimi-k2.7-code at 262144
    # tokens (deepseek-v4.1-flash and glm-5.3-flash are 1M, confirmed via
    # /api/show). 500000 chars stays under it even at a worst-case 2 chars/token
    # (Cyrillic prose, minified JSON), and leaves room for the completion. The
    # 200000 default is sized for a 64k-token member: on THIS panel it threw away
    # four fifths of the context the members could hold, and 12.5% of live traffic
    # was past it (375 of 3012 requests).
    panel_max_chars: 500000
    tool_mode: deliberate
    fusion_planning_turn_only: false # research isn't a mechanical loop — full deliberation each step is the value
    # Optional BinEval post-synth quality evaluation (non-streaming responses only).
    # Adds one extra evaluator call after the synth stage and returns per-dimension
    # scores in response headers: X-Fusion-Bineval-Score, X-Fusion-Bineval-Dimensions,
    # and X-Fusion-Bineval-Low-Score when the overall score is below threshold.
    # Useful for factual consistency checks on research / report outputs.
    # IMAGE DESCRIBE pre-stage (same rationale as fusion-coder): screenshots in a
    # research request are described once by the multimodal `model` below and
    # replaced with text, so the panel/synth never need vision.
    image_describe:
      enabled: true
      model: deepseek-v4.1-flash:cloud
      max_chars: 12000
      timeout_s: 60
    bineval:
      enabled: true
      model: gpt-oss:20b-cloud
        # The evaluator must not be a panel member, the judge, or the synth, or it
        # grades an answer it helped write. It was deepseek-v4.1-flash:cloud, which
        # is BOTH a panel seat and the synth here — the exact collision this rule
        # exists to prevent, and it survived two seat moves because the comment was
        # updated while the value was not. gpt-oss:20b-cloud holds no deliberating
        # role anywhere in this file (only fast-background, a passthrough single)
        # and adds a Western lineage to a verdict on a Chinese-lineage pipeline.
      threshold: 0.7 # overall score below this marks the output as low-quality
      timeout_s: 25
        # 60 -> 25 on 2026-09-16. bineval runs AFTER the synth, so its timeout is
        # pure tail latency on the response; a hung evaluator used to add a full
        # minute (req de359ae8: timed out at 60 s inside a 107 s request). A
        # 35B-class evaluator on a short verdict answers in a few seconds.
      # Dimensions: DELIBERATELY omitted -> the five built-in ones apply
      # (factual_consistency, instruction_following, format_compliance,
      # completeness, clarity). A custom single-dimension list used to sit here,
      # which collapsed the whole "quality score" to one bit per request — over
      # the log's history that bit read 1 on 12 of 15 evaluations, which is not a
      # signal anyone can act on.

    # Optional web grounding for the panel (research freshness). The proxy runs
    # ONE Tavily search before the panel fans out and injects the cleaned results
    # as prose context into every panel member — no member receives real tools,
    # so the one-tool_calls-per-step invariant is preserved.
    # Gated TWO ways (both required, else fully OFF, no latency/cost):
    #   1. TAVILY_API_KEY must be set in the environment (.env).
    #   2. web_search.enabled must be true here.
    # A failed search degrades silently to an ungrounded panel. Respects
    # fusion_planning_turn_only (no web search on mid-loop tool-result turns).
    web_search:
      enabled: true
      max_results: 10 # Tavily results to fetch (1-10)
      timeout_s: 30 # per-search timeout (< 60)
      max_context_chars: 8000 # cap on the injected context block
      # TypeSafe screening of each result BEFORE it is formatted into the panel
      # prompt. Two keys, same contract as the search itself: this flag AND
      # TYPESAFE_API_KEY in .env — neither alone does anything, and with
      # web_search.enabled false above, nothing here runs at all.
      #
      # Three yes/no judgments per result, thresholded in code rather than asked
      # for in a prompt: is the page trying to steer the system reading it
      # (checked FIRST — a poisoned page is usually relevant and useful-looking
      # too), is it about the request, does it state anything an answer can use.
      # Fails OPEN: if TypeSafe is unreachable the results pass through
      # unscreened (still fenced as untrusted data) with one WARN in the log.
      gate:
        enabled: true
  # fusion-agents — autonomous agent loops. Smart routing: keep the cheap 80%
  #   cheap, escalate the hard 20%. P3 tool-calling was reliable on ALL models
  #   (<2s, correct first action) -> agent choice = planning quality + cost,
  #   NOT tool-calling.
  fusion-agents:
    strategy: smart
    provider: ollama-cloud
    router: deepseek-v4.1-flash:cloud
    default: simple
    simple: fast-deepseek
    fusion: fusion-coder

  fusion-agents-x:
    strategy: smart
    provider: lg-server
    router: agy/gemini-3.5-flash-lite
      # The router is pure overhead on EVERY simple step, so it must be the
      # fastest live id that returns reliable JSON. Benchmarked 2026-09-16 with
      # the real router prompt, 3 runs each, median / valid-JSON:
      #   agy/gemini-3.5-flash-lite   1.5 s  3/3   <- this
      #   misha/qwen3.6-35b-a3b       1.2 s  1/3   (fastest, but a router that
      #                                             emits prose degrades to
      #                                             `default` — not a router)
      #   misha/glm-5.3-flash         3.1 s  3/3   (previous seat; under the
      #                                             live test matrix it took 7 s
      #                                             of a 13 s simple request)
      #   agy/gemini-3.8-flash-medium 3.2 s  3/3
      #   xai/grok-4.6-low            6.0 s  3/3
      # ACCURACY, same day, 10 prompts (5 routine / 5 genuinely complex) x 3 runs
      # with the real ROUTER_SYSTEM_PROMPT — an INVALID verdict matters as much
      # as a wrong one, because classify() degrades it to `default` (= simple),
      # i.e. a hard task silently loses its deliberation:
      #   agy/gemini-3.5-flash-lite   30/30   0 invalid
      #   deepseek-v4.1-flash:cloud   28/30   2 invalid   (router of fusion-agents)
      #   misha/glm-5.3-flash         26/30   4 invalid   (previous seat here)
      # No router sent a complex prompt to simple or a routine one to fusion; the
      # only failures were unparseable JSON, and flash-lite had none.
      # Before that, agy/gemini-3.8-flash-low held the seat and probed as "all
      # credentials cooling down" — a failing router degrades to `default` on
      # every request, so the smart routing was not routing at all. Same model
      # as the image describer of fusion-coder-x; both roles are short calls.
    default: simple
    simple: fast-js-code
    fusion: fusion-coder-x
